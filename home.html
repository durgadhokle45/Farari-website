<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Store</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
<style>
    /* General Styles */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color:black;
    }

    /* Header */
    header {
        background: black;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
    }

    .logo img {
        width: 120px;
    }

    .nav-menu {
        display: flex;
        gap: 20px;
    }

    .nav-menu a {
        color: white;
        text-decoration: none;
        font-size: 16px;
    }

    /* Hero Section */
    .hero {
        background: url('./img/ferrari-bg.jpg') no-repeat center center/cover;
        height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .hero h1 {
        font-size: 50px;
        margin: 0;
    }

    .hero p {
        font-size: 20px;
    }

    .hero button {
        background-color: #d40000;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        font-size: 18px;
    }

    /* Responsive Navigation */
    @media (max-width: 768px) {
        .nav-menu {
            flex-direction: column;
            text-align: center;
        }
        .hero h1 {
            font-size: 35px;
        }
    }
</style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./img/download.jpeg" alt="Ferrari Logo">
        </div>
        <nav class="nav-menu">
            <a href="home.html">Home</a>
            <a href="men.html">Men</a>
            <a href="women.html">Women</a>
            <a href="kids.html">kids</a>
            <a href="new arrival.html">New Arrivals</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Experience the Elegance of Ferrari</h1>
            <p>Discover our latest collections and premium accessories.</p>
            <button><a href="Collection.html">Shop Now</button></a> 
        </div>
    </section>
</body>
</html>

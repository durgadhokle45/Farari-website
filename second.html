     <!DOCTYPE html>
     <html lang="en">
     <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Ferrari News Page</title>
         <link rel="stylesheet" href="styles.css">
         <style>
             body {
                 font-family: Arial, sans-serif;
                 margin: 0;
                 padding: 0;
                 /* background: #f8f8f8;  */
                 height:30px;
                 
                 
             }
             .navbar {
                 display: flex;
                 justify-content: space-between;
                 align-items: center;
                 background: black;
                 padding: 15px 30px;
                 position: fixed;
                 width: 100%;
                 top: 0;
                 z-index: 1000;
                 height:30px;
             }
             .nav-links {
                 list-style: none;
                 display: flex;
                 align-items: center;
                 gap: 20px;
                 padding: 0;
                 margin: 0;
             }
             .nav-links li {
                 display: inline;
             }
             .nav-links a {
                 color: white;
                 text-decoration: none;
                 font-weight: bold;
                 transition: color 0.3s ease-in-out;
             }
             .nav-links a:hover {
                 color: red;
             }
             .img1 {
                 width: 50px;
                 height:40px;
                 transition: transform 0.3s ease-in-out;
             }
             .img1:hover {
                 transform: scale(1.1);
             }
             .news {
                 text-align: center;
                 padding: 0px 0px 30px;
                 background: white;
             }
             .news-container {
                 display: flex;
                 /* justify-content: center; */
                 gap: 20px;
                 flex-wrap: wrap;
                 padding: 20px;
             }
             .news-item {
                 transition: transform 0.3s ease-in-out;
             }
             .news-item:hover {
                 transform: scale(1.05);
             }
             .news-item img {
                 width: 500px;
                 border-radius: 10px;
                 max-width: 100%;
             }
             @media (max-width: 768px) {
                 .navbar {
                     flex-direction: column;
                     align-items: flex-start;
                 }
                 .nav-links {
                     flex-direction: column;
                     gap: 10px;
                 }
                 /* .news-container {
                     flex-direction: column; */
                     /* align-items: center; */
                 
             }
             .text2{
                font-size:40px;
                text-align: center;
             }
             .img3{
                height:50px;
                width:3%;
                margin-top:70px;
                margin-left:550px;
             }
             .img4{
                 width:55%;
               margin-left:30px;
               height:370px; 
               
             }
             .images{
                display: flex;
               
                 }
                 .img5{
                    height:350px;
                    width:30%;
                    margin-left:50px;
                 }
         </style>
     </head>
     <body>
         <header>
             <nav class="navbar">
                 <ul class="nav-links">
                     <img src="farari.jpg" class="img1"> 
                     <li><a href="#">RACING</a></li>
                     <li><a href="#">SPORTS CARS</a></li>
                     <li><a href="#">COLLECTIONS</a></li>
                     <li><a href="#">EXPERIENCES</a></li>
                     <li><a href="#">ABOUT US</a></li>
                     <li class="text1"><a href="#">SEARCH</a></li>
                 </ul>
             </nav>
         </header>
         <img src="logo.jpg"class="img3">
          <section class="news"> 
            
            
             <h1 class="text2">News</h1>
             
             </section>
             <div class="images">
                     
              <img src="f2.jpg"class="img4">
              <img src="car2.jpg"class="img5"> 

                 <!-- <div class="news-item">
                     <img src="news2.jpg" alt="Ferrari F1">
                 </div>
             </div>
         </section>
     </body>
     </html>

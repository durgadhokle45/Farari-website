<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Car Website</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background: black;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav ul li {
            display: inline;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        .hero {
            background: url('https://source.unsplash.com/1600x900/?ferrari') no-repeat center;
            background-size: cover;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }
        .model-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .model {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ferrari Supercars</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#models">Models</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <section id="home">
        <div class="hero">
            <h2>Experience Speed & Luxury</h2>
            <p>Discover the latest Ferrari supercars with unmatched performance and style.</p>
            <button onclick="showAlert()">Explore More</button>
        </div>
    </section>

    <section id="models">
        <h2>Our Models</h2>
        <div class="model-list">
            <div class="model">
                <img src="https://source.unsplash.com/400x300/?ferrari" alt="Ferrari Model 1">
                <h3>Ferrari LaFerrari</h3>
            </div>
            <div class="model">
                <img src="https://source.unsplash.com/400x300/?ferrari-car" alt="Ferrari Model 2">
                <h3>Ferrari F8 Tributo</h3>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Ferrari. All rights reserved.</p>
    </footer>

    <script>
        function showAlert() {
            alert('Explore Ferrari Supercars Now!');
        }
    </script>
</body>
</html>

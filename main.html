 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
           
            
        }
        .sidebar {
            width: 150px;
            background: #111;
            color: white;
             padding: 20px;  
            height:91vh;
            margin-left:50px;
           
            
        }
        .text01{
            font-size:10px;
    color:grey;
        }
        .menu-item {
            cursor: pointer;
            padding: 10px;
            font-size: 10px;
            border-bottom: 1px solid #333;
        }
        .submenu {
            display: none;
            padding-left: 20px;
        }
        .submenu a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 5px 0;
        }
         .div1{
            height:380px;
            width:7%;
            background-color: #1a1a1a;
            display: flex;
        } 
        .car4{
            height:380px;
           width:1400%;
            margin-left:0px;
        }
        
        
    </style>
</head>
<body>
     <div class="div1"> 
          <div class="sidebar">
       <h2 class="text01">EXPERIENCES</h2>
     
       
        <div class="menu-item" onclick="toggleDropdown('corse-clienti')">Corse Clienti &#x25BC;
             <div class="submenu" id="corse-clienti">
                <a href="third.html">News</a>
                <a href="calender.html">Calender</a>

                </div>

                        <a href="forth.html">Overview</a>
                        <a href="third.html">News</a>

                    </div>
                    </div>
                    </div>
                
                    
                <img src="images/car4.jpg" class="car4">
            </div>
            </div>

    <script>
        function toggleDropdown(id) {
            var submenu = document.getElementById(id);
            if (submenu.style.display === "block") {
                submenu.style.display = "none";
            } else {
                submenu.style.display = "block";
            }
        }
    </script>
</body>
</html>
